name: project_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  image_picker: ^1.2.2
  geolocator: ^13.0.2
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  sqlite_viewer2: ^2.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  floating_bottom_bar: ^0.0.4
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/project_akhir/logoicon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/project_akhir/logoicon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/project_akhir/logoicon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/project_akhir/logoicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/project_akhir/
